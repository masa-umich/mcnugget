variables:
  countdown_duration: 20 #time from 'Enter' to T-0
  burn_duration: 3 #how long things stay on after T-0
  ox_mpv_offset_time: 0.67 #secs before ignition point to open ox valve - start before fuel
  fuel_mpv_offset_time: 0.34 #secs before ignition point to open fuel valve - placeholder value rn 
  igmiter_offset_time: 0 #relative 0 mark - ignition starts now
  using_ox: True
  using_fuel: True

#i'm gonna use placeholders until i double check with prop team
channel_mappings:
  ebox:
    pts:
      ox_bottle_pt: 1
      ox_post_reg_pt: 2 #the methan will be downstream of regulator(i think)
      fuel_bottle_pt: 3
      fuel_post_reg_pt: 4 #the methan will be downstream of regulator(i think)
      torch_pt1: 5
      torch_pt2: 6
      torch_pt3: 7
  valves:
    ox_mpv: 1
    fuel_mpv: 2
    ox_pilot: 3
    fuel_pilot: 4
    igniter: 5 #spark plug
    #nts - the mpv's actuate the pnuematic mpv(double check with jack what that means/ check sys pic) the pilots are parallel to the mpv's
    