# Alias file for easy channel configuration in code
# Interpretted in the format:
#
# gse:
#   pt:
#     1: channel_alias_A
#     2: channel_alias_B
#     ...
#
# Becomes:
# channel_alias_A = gse_pt_1
# channel_alias_B = gse_pt_2

gse:
  pt:
    1: Ox_Fill_PT
    2: Pneumatics_2k_Bottle_PT
    3: Fuel_MPV_Pneumatics_PT
    4: Trailer_Pneumatics_PT
    5: Purge_2k_Bottle_PT
    6: Purge_Post_Reg_PT
    7: Trickle_Purge_PT
    8: Bottle_1_PT
    15: Bottle_2_PT
    16: Bottle_3_PT
    17: Bottle_4_PT
    18: Press_Fill_PT
    19: Reg_Set_PT
    20: Ox_MPV_Pneumatics
  tc:
    1: Bottle_1_Skin_TC
    2: Bottle_2_Skin_TC
    3: Bottle_3_Skin_TC
    4: Bottle_4_Skin_TC
  vlv:
    1: Ox_Fill_Valve
    2: Ox_Drain_Valve
    3: Press_Iso_1
    4: Press_Iso_2
    5: Press_Iso_3
    6: Press_Fill_Iso
    8: Ox_Pre_Press
    11: Fuel_Fill_Purge
    15: Ox_Fill_QD_Pilot
    16: Ox_Pre_Press_QD_Pilot
    17: COPV_Fill_QD_Pilot
    18: Igniter
    19: Press_Iso_4
    20: Press_Fill_Vent # normally_open: true

fc:
  pt:
    1: Recovery_Bottle_PT
  tc: {}
  vlv:
    1: Recovery_Piston_Pilot
    2: Drogue_Parachute_TD
    3: Main_Parachute_TD

