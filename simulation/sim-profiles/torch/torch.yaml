# Torch igniter simulation profile
do_noise: false
default_pt_noise_sigma: 5
do_temp_simulation: false 
default_tc_noise_sigma: 2
frequency: 50 
atmosphere_volume_name: "atmosphere"

volumes:
  - name: "gox bottle"
    volume: 49 
    initial_pressure: 2000 
    initial_temperature: 20 
    channels: ["Ox_Bottle_PT"]
  - name: "gox manifold" # tubing between the ox regulator and the mpv
    volume: 0.05
    initial_pressure: 2000 # starts equal to the bottle since there's no regulator
    initial_temperature: 20
    channels: ["Ox_Post_Reg_PT"]
  - name: "methane bottle"
    volume: 49
    initial_pressure: 2000
    initial_temperature: 20
    channels: ["Fuel_Bottle_PT"]
  - name: "methane manifold" 
    volume: 0.05
    initial_pressure: 2000
    initial_temperature: 20
    channels: ["Fuel_Post_Reg_PT"]
  - name: "torch chamber"
    volume: 0.05
    initial_pressure: 0
    initial_temperature: 20
    channels: ["Torch_PT_1", "Torch_PT_2", "Torch_PT_3"]

valves:
  #nts-(no channel = always open, nothing in Synnax) ---
  - inlet: "gox bottle" # placeholder for needle valve + regulator until regulators are simulated
    outlet: "gox manifold"
    flow_coefficient: 1.0e-4
  - inlet: "methane bottle" #placeholder until sim
    outlet: "methane manifold"
    flow_coefficient: 1.0e-4
  - inlet: "torch chamber" # torch exhaust into the (unlit) main engine
    outlet: "atmosphere"
    flow_coefficient: 1.8e-5

  #remote controlled valves
  - channel: "Ox_MPV"
    inlet: "gox manifold"
    outlet: "torch chamber"
    flow_coefficient: 1.0e-6
    is_check_valve: false
    is_normally_open: false
  - channel: "Fuel_MPV"
    inlet: "methane manifold"
    outlet: "torch chamber"
    flow_coefficient: 1.0e-6
    is_check_valve: false
    is_normally_open: false
  - channel: "Ox_Pilot"
    inlet: "gox manifold"
    outlet: "torch chamber"
    flow_coefficient: 1.0e-7 # smaller than the MPV, goes through an orifice on the PNID
    is_check_valve: false
    is_normally_open: false
  - channel: "Fuel_Pilot"
    inlet: "methane manifold"
    outlet: "torch chamber"
    flow_coefficient: 1.0e-7
    is_check_valve: false
    is_normally_open: false
  
  - channel: "Igniter"
    inlet: "torch chamber"
    outlet: "torch chamber"
    flow_coefficient: 0
    is_check_valve: false
    is_normally_open: false